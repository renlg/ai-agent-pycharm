tool.description.webSearchAdvanced=Search the web for current information with optional time-range and category filters.
tool.description.readFile=Read a file by absolute path or a path relative to the project root.
tool.description.writeFile=Create or overwrite a file and any required parent directories.
tool.description.replaceFile=Replace exact text, a line range, or insert content after a line in a file.
tool.description.listDirectory=List a directory tree to explore the project and verify paths.
tool.description.loadSkill=Load the full instructions for a named Skill from the available Skills list.
tool.description.searchMemory=Search saved long-term memories such as facts, preferences, addresses, and commands.
tool.description.saveMemory=Save a long-term memory with a key, category, and searchable synonym tags.
tool.description.runCommand=Run a command from the project root in the visible IntelliJ terminal and return its output.
tool.description.todoPlan=Maintain a lightweight session plan with init, add, complete, and status actions.
tool.description.searchCode=Search project text with keywords or regular expressions and return structured file and line matches.
tool.description.findSymbol=Find class, method, or field definitions using IntelliJ symbol indexes.
tool.description.findReferences=Find all references to a class, method, or field using IntelliJ Find Usages.
tool.description.goToDefinition=Find a symbol definition and return its file, line, and source.
tool.description.getProblems=Return live compiler errors and lint warnings from the IDE analyzer.
tool.description.generateImage=Generate or edit images from a text prompt using an OpenAI-compatible image API.

