# 图像生成工具（generate_image）提示词/描述文案
# 可按需修改以下文案以调整 LLM 对该工具的理解与使用方式（工具描述、参数说明），无需重新编译。
# 缺失该文件或缺失某个 key 时，代码会回退到内置默认文案（见 ImageGenerationTool.java）。

image_gen.tool_description=根据文字描述生成图像。接受文本提示词，调用图像生成 API（OpenAI 兼容格式）创建图像，生成的图像将内联显示在对话中并可下载保存。适用于需要可视化内容、插图、概念设计的场景。如果用户最近一条消息附带了图片（例如“按这张图生成一只猫”“参考这张图……”），会自动将该图片作为参考图进行图生图（image-to-image），无需在参数中传入图片数据。

image_gen.param.prompt.description=图像描述提示词（支持中英文），描述要生成的图像内容、风格、色彩、构图等细节

image_gen.param.size.description=图像尺寸，可选：256x256、512x512、1024x1024、1792x1024（横版）、1024x1792（竖版）

image_gen.param.n.description=生成图像数量（1-4），默认使用设置中配置的值
